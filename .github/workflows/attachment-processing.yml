name: 첨부 처리

on:
  workflow_dispatch:

permissions:
  contents: read

# 실행 중인 PDF 처리는 계속 진행한다. 대기 실행이 합쳐져도 작업은 Turso에 남는다.
concurrency:
  group: attachment-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # 이미지 빌드와 이미 선점한 파일의 처리 시간을 포함하는 전체 작업 한도다.
    timeout-minutes: 25
    environment: attachment-processing
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.attachments
          tags: g2b-attachment-worker:run
          load: true
          cache-from: type=gha,scope=attachment-worker
          cache-to: type=gha,mode=max,scope=attachment-worker
      - name: 첨부 큐 처리
        run: >-
          docker run --rm --init --memory "$ATTACHMENT_DOCKER_MEMORY" --cpus "$ATTACHMENT_DOCKER_CPUS"
          -e TURSO_DATABASE_URL -e TURSO_AUTH_TOKEN
          g2b-attachment-worker:run node scripts/attachment-worker.cjs --once
        env:
          # 컨테이너 한도는 상시 워커의 compose.attachments.yaml에도 정의한다.
          ATTACHMENT_DOCKER_MEMORY: "512m"
          ATTACHMENT_DOCKER_CPUS: "0.5"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
